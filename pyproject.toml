[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rallybot"
version = "0.1.0"
description = "AI-powered tennis ladder and court dispatcher."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic-settings>=2,<3",
    "httpx>=0.28,<1",
    "discord.py>=2.6,<3",
    "langgraph>=1.2.17,<2",
    "langgraph-checkpoint-sqlite>=3.0.1,<4",
    "langchain-ollama>=1.1,<2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
rallybot = "rallybot.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = ["--basetemp=.pytest_tmp"]
